name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]"
      - run: pytest
      - run: python -m compileall -q src
      - run: python -m build
      - name: Assert the wheel ships the skill and the service preset
        run: |
          python -m zipfile -l dist/*.whl | grep -q 'linxira_crash_watch/skills/diagnose-crash/SKILL.md'
          python -m zipfile -l dist/*.whl | grep -q 'linxira-crash-watch.preset'
      - run: python -c "import xml.etree.ElementTree as E; E.parse('data/org.linxira.CrashWatch.metainfo.xml')"
      - run: |
          ! grep -R -E -n 'shell=True|os\.system|subprocess\.(getoutput|call)\(' src